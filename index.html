<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Fullstack con Supabase</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f7f7; color: #333; margin: 0; padding: 0; }
    header { background: #0b666a; color: white; text-align: center; padding: 20px; }
    main { display: flex; gap: 20px; max-width: 1000px; margin: 20px auto; padding: 0 20px; flex-wrap: wrap; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); flex: 1; min-width: 350px; }
    h2 { margin-top: 0; color: #0b666a; }
    input, textarea, button { width: 100%; margin: 10px 0; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
    button { background: #0b666a; color: white; font-weight: bold; cursor: pointer; border: none; }
    button:hover { background: #084f52; }
    .mensaje { padding: 12px; border-bottom: 1px solid #e9ecef; display: flex; justify-content: space-between; align-items: center; }
    .btn-borrar { background: #dc3545; width: auto; padding: 5px 10px; font-size: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>App Fullstack con Netlify</h1>
    <p>Frontend HTML + Backend con Netlify Functions</p>
  </header>

  <main>
    <section class="card">
      <h2>Enviar mensaje</h2>
      <form id="formMensaje">
        <input id="nombre" placeholder="Nombre" required />
        <input id="email" type="email" placeholder="Email" required />
        <textarea id="mensaje" placeholder="Escribe un mensaje..." required></textarea>
        <button type="submit" id="btnEnviar">Enviar al backend</button>
      </form>
    </section>

    <section class="card">
      <h2>Mensajes</h2>
      <button id="btnCargar">Cargar mensajes</button>
      <div id="listaMensajes"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById("formMensaje");
    const lista = document.getElementById("listaMensajes");
    const btnEnviar = document.getElementById("btnEnviar");
    const API_BASE = "/.netlify/functions";

    // 1. Lógica para enviar mensaje (POST)
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btnEnviar.disabled = true;
      btnEnviar.textContent = "Enviando...";
      const data = {
        nombre: document.getElementById("nombre").value,
        email: document.getElementById("email").value,
        mensaje: document.getElementById("mensaje").value
      };
      try {
        const response = await fetch(`${API_BASE}/mensajes`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        if (!response.ok) throw new Error("Error al enviar");
        alert("¡Enviado con éxito!");
        form.reset();
      } catch (err) { alert("Error: " + err.message); }
      finally { btnEnviar.disabled = false; btnEnviar.textContent = "Enviar al backend"; }
    });

    // 2. Lógica para cargar mensajes (GET)
    document.getElementById("btnCargar").addEventListener("click", cargarMensajes);

    async function cargarMensajes() {
      try {
        const response = await fetch(`${API_BASE}/mensajes`);
        const resJson = await response.json();
        lista.innerHTML = "";
        resJson.data.forEach(item => {
          const div = document.createElement("div");
          div.className = "mensaje";
          div.innerHTML = `
            <div><b>${item.nombre}</b>: ${item.mensaje}</div>
            <button class="btn-borrar" onclick="borrarMensaje(${item.id})">Borrar</button>
          `;
          lista.appendChild(div);
        });
      } catch (err) { alert("Error al cargar: " + err.message); }
    }

    // 3. Lógica para borrar mensaje (DELETE)
    async function borrarMensaje(id) {
      if (!confirm("¿Borrar este mensaje?")) return;
      try {
        const res = await fetch(`${API_BASE}/mensajes?id=${id}`, { method: 'DELETE' });
        if (res.ok) {
          alert("Mensaje borrado");
          cargarMensajes(); // Refresca la lista automáticamente
        } else {
          alert("Error al borrar");
        }
      } catch (err) { alert("Error: " + err.message); }
    }
  </script>
</body>
</html>
