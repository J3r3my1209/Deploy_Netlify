<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>App Fullstack</title>
</head>
<body>
  <form id="formMensaje">
    <input id="nombre" placeholder="Nombre" required />
    <input id="email" type="email" placeholder="Email" required />
    <textarea id="mensaje" placeholder="Mensaje" required></textarea>
    <button type="submit">Enviar</button>
  </form>
  <button id="btnCargar">Cargar mensajes</button>
  <div id="listaMensajes"></div>

  <script>
    const form = document.getElementById("formMensaje");
    const lista = document.getElementById("listaMensajes");
    const API_BASE = "/.netlify/functions";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = {
        nombre: document.getElementById("nombre").value,
        email: document.getElementById("email").value,
        mensaje: document.getElementById("mensaje").value
      };

      try {
        const response = await fetch(`${API_BASE}/mensajes`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);
        
        alert("¡Enviado!");
        location.reload(); 
      } catch (err) {
        alert("Error: " + err.message);
      }
    });

    document.getElementById("btnCargar").addEventListener("click", async () => {
      try {
        const response = await fetch(`${API_BASE}/mensajes`);
        const resJson = await response.json();
        lista.innerHTML = "";
        resJson.data.forEach(item => {
          const div = document.createElement("div");
          div.innerHTML = `<b>${item.nombre}</b>: ${item.mensaje}`;
          lista.appendChild(div);
        });
      } catch (err) {
        alert("Error al cargar: " + err.message);
      }
    });
  </script>
</body>
</html>
